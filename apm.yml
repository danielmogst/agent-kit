name: agent-kit
version: 1.1.0
description: Portable AI-agent toolkit - full personal skill collection, 25 Autoprompt subagents, Gemini vision setup, and OpenCode integration
author: Daniel
license: MIT
keywords: [opencode, skills, agents, autoprompt, design, vision, gemini]

# Restrict deployment to OpenCode: the vision tool/plugin payload is
# OpenCode-specific and the agents use OpenCode frontmatter conventions.
targets:
  - opencode

# Ship the OpenCode payload + bootstrap with apm pack bundles too.
includes:
  - .apm
  - payload
  - scripts
  - docs
